<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Slice of Heaven Pizza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- navigation -->
    <nav class="navbar">
        <div class="logo">Kapadiya pizza</div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
    </nav>

    <!-- contact -->
    <section class="container">
        <h1>Contact & Orders</h1>
        <p>Want to book a table or place a bulk party order? Send us a message below!</p>

        <form class="contact-form">
            <label for="name">Your Name:</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" placeholder="Enter your phone number" required>

            <label for="message">Your Order or Message:</label>
            <textarea id="message" rows="5" placeholder="Write your pizza order or question..." required></textarea>

            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <!--down footer -->
    <footer>
        <p>&copy; 2026 Slice of Heaven Pizza. All rights reserved.</p>
    </footer>

</body>
</html>
