<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Slice of Heaven Pizza</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- navigation -->
    <nav class="navbar">
        <div class="logo">Kapadiya Pizza</div>
        <ul class="nav-links">
            <li><a href="index.html" class="active">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- main Section -->
    <header class="hero">
        <h1>Hot, Fresh, and Cheesy Pizza</h1>
        <p>Home made pizza</p>
        <a href="contact.html" class="btn">Order Now</a>
    </header>

    <!-- Pizzas  -->
    <section class="container">
        <h2>Our Popular Pizzas</h2>
        <div class="cards">
            <div class="card">
                <img src="pizza1.png" alt="Margherita Pizza">
                <h3>Classic Margherita</h3>
                <p class="price">₹249</p>
            </div>
            <div class="card">
                <img src="pizza2.png" alt="Farmhouse Veggie Pizza">
                <h3>Farmhouse Veggie</h3>
                <p class="price">₹349</p>
            </div>
            <div class="card">
                <img src="pizza3.png" alt="Paneer Tikka Pizza">
                <h3>Spicy Paneer Tikka</h3>
                <p class="price">₹399</p>
            </div>
        </div>
    </section>

    <!--Down Footer -->
    <footer>
        <p>Kapadiya pizza</p>
    </footer>

</body>
</html>
